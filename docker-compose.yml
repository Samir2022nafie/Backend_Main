version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hobbyhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hobbyhub_user
      POSTGRES_PASSWORD: hobbyhub_secure_password
      POSTGRES_DB: hobbyhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hobbyhub_user -d hobbyhub_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hobbyhub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://hobbyhub_user:hobbyhub_secure_password@postgres:5432/hobbyhub_db?schema=public
      JWT_SECRET: production_jwt_secret_token_1234567890_abcdef
      STORAGE_PUBLIC_URL: https://storage.hobbyhub.local
      ENVIRONMENT: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
