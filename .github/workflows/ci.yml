name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run linter and typecheck
        run: npm run lint

      - name: Run build
        run: npm run build

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run test suites
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/testdb"
          JWT_SECRET: "test_jwt_secret_token_1234567890"

  docker-smoke-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: hobbyhub-backend:ci-test
          load: true

      - name: Smoke test container execution
        run: |
          docker network create test-net
          docker run -d --name test-db --network test-net \
            -e POSTGRES_USER=hobbyhub_user \
            -e POSTGRES_PASSWORD=hobbyhub_secure_password \
            -e POSTGRES_DB=hobbyhub_db \
            postgres:16-alpine
          sleep 5
          docker run -d --name test-app --network test-net -p 3000:3000 \
            -e NODE_ENV=production \
            -e DATABASE_URL="postgresql://hobbyhub_user:hobbyhub_secure_password@test-db:5432/hobbyhub_db?schema=public" \
            -e JWT_SECRET="test_jwt_secret_token_1234567890" \
            hobbyhub-backend:ci-test
          sleep 8
          docker ps
          docker logs test-app
          curl -f http://localhost:3000/api/v1/health || exit 1
          docker stop test-app test-db
          docker rm test-app test-db
          docker network rm test-net
